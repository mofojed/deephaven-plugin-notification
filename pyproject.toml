[build-system]
requires = ["setuptools>=43.0.0", "wheel", "deephaven-plugin-packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "deephaven-plugin-notification"
version = "0.1.0"
description = "A Deephaven plugin that displays OS-level system notifications from dh.ui render trees via the browser's Notifications API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["deephaven", "plugin", "notification", "notifications", "alerts"]
authors = [{ name = "dsmmcken" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Plugins",
    "Operating System :: OS Independent",
]
dependencies = [
    "deephaven-core>=0.35.1",
    "deephaven-plugin>=0.6.0",
    "deephaven-plugin-utilities>=0.0.2",
    # 0.41.0 is the first release with plugin event support (use_send_event +
    # the JS eventMapping this plugin registers).
    "deephaven-plugin-ui>=0.41.0",
]

[project.urls]
Homepage = "https://github.com/dsmmcken/deephaven-plugin-notification"
Repository = "https://github.com/dsmmcken/deephaven-plugin-notification"
Issues = "https://github.com/dsmmcken/deephaven-plugin-notification/issues"

[project.entry-points."deephaven.plugin"]
registration_cls = "deephaven_plugin_notification.register:DeephavenPluginNotificationRegistration"

# Dev tooling installed by `uv sync`. ruff = lint/format, ty = type checking
# (both from Astral). deephaven-server/watchdog power plugin_builder's
# --server/--watch modes; click/watchdog are imported by plugin_builder.py.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty",
    "pytest>=8",
    "deephaven-server",
    "watchdog",
    "click",
]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
# Only ship the Python package. Without this, namespace discovery walks the JS
# source tree (src/js) and treats any node_modules dir containing a stray *.py
# as a top-level `js` package, polluting the wheel and site-packages. The built
# JS itself ships under deephaven_plugin_notification/_js via setup.py's
# package_js step, not through package discovery.
include = ["deephaven_plugin_notification*"]
exclude = ["js*"]

# This project is built/installed as a wheel via `uv build` + `uv pip install`
# (see plugin_builder.py), which also runs the custom JS-packaging step in
# setup.py. Marking it virtual keeps `uv sync` from trying to build the plugin
# (and its JS) just to set up the dev environment; the runtime deps and dev
# group are still installed.
[tool.uv]
package = false

[tool.ruff]
line-length = 88
src = ["src"]
extend-exclude = ["src/js"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, flake8-bugbear,
# flake8-implicit-str-concat (ISC).
select = ["E", "F", "I", "UP", "B", "ISC"]
# `ruff format` owns code line length; E501 only flags long comments/strings it
# cannot reflow, so leave it off to avoid noise.
ignore = ["E501"]

# Disallowing multiline implicit concat catches the missing-comma-in-a-list
# footgun where two adjacent string literals silently merge into one.
[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.format]
docstring-code-format = true
